<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>対戦を作成 | 株価成長バトル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="setup-page">
  <header class="site-header simple">
    <a class="brand" href="setup.html"><span class="brand-mark">↗</span><span>株価成長バトル</span></a>
  </header>

  <main class="page-shell narrow">
    <section class="hero setup-hero">
      <p class="eyebrow">BATTLE SETUP</p>
      <h1>4人の銘柄を登録して<br>バトルを始めよう</h1>
      <p>対戦名、銘柄、購入価格、所有株数、繰越余剰金を登録します。作成後に4人で共有できるURLが発行されます。</p>
    </section>

    <div id="notice" class="message notice hidden"></div>
    <div id="error" class="message error hidden"></div>
    <section id="setup-required" class="panel hidden">
      <h2>初期設定が必要です</h2>
      <p><code>config.js</code>にSupabaseのURLとPublishable keyを設定してください。</p>
    </section>

    <form id="create-form" class="stack-xl hidden">
      <section class="panel form-section">
        <div class="section-heading">
          <div><p class="eyebrow">BATTLE INFO</p><h2>対戦情報</h2></div>
        </div>
        <div class="form-grid two">
          <label class="field full">対戦名<input name="battle_name" required maxlength="60" placeholder="例：2026年 夏の株価対決"></label>
          <label class="field">開始日<input name="start_date" type="date" required></label>
          <label class="field">終了日（任意）<input name="end_date" type="date"></label>
        </div>
      </section>

      <section class="panel form-section">
        <div class="section-heading">
          <div><p class="eyebrow">PORTFOLIOS</p><h2>参加者・銘柄・保有資産</h2></div>
          <span class="pill">4人固定</span>
        </div>
        <div id="player-fields" class="players-grid"></div>
      </section>

      <button class="primary large full-button" type="submit">対戦を作成する</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="setup.js"></script>
</body>
</html>
