<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a"><title>設定 | 株価成長バトル</title><link rel="stylesheet" href="style.css"></head>
<body class="app-page setup-page">
<header class="site-header"><a class="brand" data-page="index.html">株価成長バトル</a><nav class="top-nav"><a data-page="index.html">メイン</a><a data-page="input.html">終値入力</a><a data-page="setup.html" class="active">設定</a></nav></header>
<main class="page-shell narrow">
  <section class="page-heading"><div><p class="eyebrow" id="setup-mode-label">DEVELOPER</p><h1 id="setup-title">対戦設定</h1><p id="setup-description" class="muted">対戦内容と大会ルールを管理します。</p></div><a id="new-battle-link" class="secondary button-link compact-button hidden" href="setup.html">新しい対戦</a></section>
  <div id="notice" class="message notice hidden"></div><div id="error" class="message error hidden"></div>
  <section id="setup-required" class="panel hidden"><h2>初期設定が必要です</h2><p><code>config.js</code>を設定してください。</p></section>
  <section id="saved-section" class="panel saved-battles-panel hidden"><div class="section-heading"><div><p class="eyebrow">ARCHIVE</p><h2>保存済みの対戦</h2></div></div><div id="saved-battles" class="saved-battle-list"></div></section>
  <form id="create-form" class="stack-xl hidden">
    <section class="panel form-section"><div class="section-heading"><div><p class="eyebrow">BATTLE INFO</p><h2>対戦情報</h2></div></div><div class="form-grid two"><label class="field full">対戦名<input name="battle_name" required maxlength="60"></label><label class="field">開始日<input name="start_date" type="date" required></label><label class="field">終了日（任意）<input name="end_date" type="date"></label><label class="field full">繰越余剰金（対戦全体）<input name="carryover_cash" type="number" min="0" step="1" required value="0"></label><label class="field full">大会ルール・メモ<textarea name="rules" maxlength="5000" rows="7" placeholder="例：期間中の途中利確を認める。配当は計算しない。"></textarea></label></div></section>
    <section class="panel form-section"><div class="section-heading"><div><p class="eyebrow">PORTFOLIOS</p><h2>参加者と銘柄</h2></div><span class="pill">4人固定</span></div><div id="player-fields" class="players-grid"></div></section>
    <button id="submit-button" class="primary large full-button" type="submit">対戦を作成する</button>
  </form>
</main>
<dialog id="sale-edit-dialog"><form id="sale-edit-form" method="dialog"><h2>利確情報を修正</h2><p id="sale-edit-label" class="dialog-description"></p><input id="sale-edit-player-id" type="hidden"><label class="field">売却日<input id="sale-edit-date" type="date" required></label><label class="field">売却価格<input id="sale-edit-price" type="number" min="0.01" step="0.01" required></label><div class="dialog-actions"><button class="secondary" value="cancel">キャンセル</button><button class="primary" value="save">修正を保存</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="setup.js"></script></body></html>
