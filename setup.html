<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>対戦設定 | 株価成長バトル</title><link rel="stylesheet" href="style.css"></head>
<body class="setup-page"><header class="site-header simple"><a class="brand" href="setup.html"><span class="brand-mark">↗</span><span>株価成長バトル</span></a></header>
<main class="page-shell narrow">
<section class="hero setup-hero"><p class="eyebrow" id="setup-mode-label">NEW BATTLE</p><h1 id="setup-title">4人の銘柄を登録</h1><p id="setup-description">新しい対戦は別データとして保存され、以前の対戦は残ります。</p></section>
<div id="notice" class="message notice hidden"></div><div id="error" class="message error hidden"></div>
<section id="setup-required" class="panel hidden"><h2>初期設定が必要です</h2><p><code>config.js</code>を設定してください。</p></section>
<section id="saved-section" class="panel saved-battles-panel hidden"><div class="section-heading"><div><p class="eyebrow">SAVED BATTLES</p><h2>この端末で開いた対戦</h2></div></div><div id="saved-battles" class="saved-battle-list"></div></section>
<form id="create-form" class="stack-xl hidden">
<section class="panel form-section"><div class="section-heading"><div><p class="eyebrow">BATTLE INFO</p><h2>対戦情報</h2></div><a id="new-battle-link" class="secondary button-link hidden" href="setup.html">新しい対戦を作る</a></div><div class="form-grid two"><label class="field full">対戦名<input name="battle_name" required maxlength="60"></label><label class="field">開始日<input name="start_date" type="date" required></label><label class="field">終了日（任意）<input name="end_date" type="date"></label><label class="field full">繰越余剰金（対戦全体）<input name="carryover_cash" type="number" min="0" step="1" required value="0"><small>4人共通の現金残高として、合計資産に1回だけ加算します。</small></label></div></section>
<section class="panel form-section"><div class="section-heading"><div><p class="eyebrow">PORTFOLIOS</p><h2>参加者と銘柄</h2></div><span class="pill">4人固定</span></div><div id="player-fields" class="players-grid"></div></section>
<button id="submit-button" class="primary large full-button" type="submit">対戦を作成する</button>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="setup.js"></script></body></html>
