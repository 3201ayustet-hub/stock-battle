<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>設定 | 株価成長バトル</title><link rel="stylesheet" href="style.css?v=2.5"></head>
<body><header class="site-header"><a class="brand" data-page="index.html">株価成長バトル</a><nav class="top-nav"><a data-page="index.html">メイン</a><a data-page="input.html">終値入力</a><a data-page="setup.html" class="active">設定</a></nav></header>
<main class="page-shell narrow"><section class="page-heading"><div><p class="eyebrow">LEAGUE ADMINISTRATION</p><h1 id="setup-title">保存済みの対戦</h1><p id="setup-description" class="muted">編集する対戦を選択します。</p></div><div class="heading-actions"><a id="back-to-list" class="secondary button-link compact-button hidden" href="setup.html">← 一覧へ戻る</a><a id="new-battle-link" class="secondary button-link compact-button" href="setup.html?mode=new">新しい対戦</a></div></section><div id="notice" class="message notice hidden"></div><div id="error" class="message error hidden"></div>
<section id="setup-required" class="panel hidden"><h2>初期設定が必要です</h2><p><code>config.js?v=2.5</code>を設定してください。</p></section>
<section id="saved-section" class="panel hidden"><div class="section-heading"><div><p class="eyebrow">LEAGUE ARCHIVE</p><h2>保存済みの対戦</h2></div></div><div id="saved-battles" class="saved-battle-list"></div></section>
<form id="create-form" class="stack-xl hidden">
<section class="panel form-section"><div class="section-heading"><div><p class="eyebrow">SEASON CONFIGURATION</p><h2>大会設定</h2></div></div><div class="form-grid two"><label class="field full">対戦名<input name="battle_name" required maxlength="60"></label><label class="field">開始日<input name="start_date" type="date" required></label><label class="field">終了日（任意）<input name="end_date" type="date"></label><label class="field">初期資産額<input name="initial_assets" type="number" min="0" step="1" required></label><label class="field">繰越余剰金<input name="carryover_cash" type="number" min="0" step="1" required value="0"></label></div></section>
<section class="panel form-section"><div class="section-heading"><div><p class="eyebrow">INVESTORS</p><h2>参加者</h2></div><span class="pill">4人固定</span></div><div id="player-fields" class="players-compact"></div></section>
<section class="panel form-section"><div class="section-heading"><div><p class="eyebrow">LEAGUE RULES</p><h2>大会ルール</h2></div></div><label class="field"><textarea name="rules" maxlength="5000" rows="7" placeholder="途中利確、配当の扱いなどを自由に記載"></textarea></label></section>
<button id="submit-button" class="primary large full-button" type="submit">対戦を作成する</button>
<section id="danger-zone" class="panel danger-zone hidden"><div><h2>対戦を削除</h2><p class="muted">終値履歴を含めて削除します。元に戻せません。</p></div><button id="delete-battle" class="danger" type="button">対戦を削除</button></section>
</form></main>
<dialog id="sale-edit-dialog"><form id="sale-edit-form" method="dialog"><h2>利確情報を修正</h2><p id="sale-edit-label" class="muted"></p><input id="sale-edit-player-id" type="hidden"><label class="field">売却日<input id="sale-edit-date" type="date" required></label><label class="field">売却価格<input id="sale-edit-price" type="number" min="0.01" step="0.01" required></label><div class="dialog-actions"><button class="secondary" value="cancel">キャンセル</button><button class="primary" value="save">保存</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=2.5"></script><script src="common.js?v=2.5"></script><script src="setup.js?v=2.5"></script></body></html>
