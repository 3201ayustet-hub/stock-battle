<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>登録履歴 | 株価成長バトル</title><link rel="stylesheet" href="style.css?v=2.5"></head>
<body><header class="site-header"><a class="brand" data-page="index.html">株価成長バトル</a><nav class="top-nav"><a data-page="index.html">メイン</a><a data-page="input.html" class="active">終値入力</a><a data-page="setup.html">設定</a></nav></header>
<main class="page-shell narrow-medium"><div id="notice" class="message notice hidden"></div><div id="error" class="message error hidden"></div><section id="missing-battle" class="panel empty-state hidden"><h1>対戦がありません</h1><a class="primary button-link" href="setup.html">設定を開く</a></section>
<div id="input-content" class="hidden"><section class="page-heading"><div><p class="eyebrow">HISTORY</p><h1>登録履歴</h1><p id="battle-label" class="muted"></p></div><a data-page="index.html" class="primary button-link compact-button">メインへ</a></section><section class="panel table-wrap"><table><thead><tr><th>日付</th><th>参加者</th><th>終値</th><th></th></tr></thead><tbody id="history-body"></tbody></table><div id="empty-history" class="empty-state"><p>まだ終値はありません。</p></div></section></div></main>
<dialog id="edit-dialog"><form id="edit-form" method="dialog"><h2>終値を修正</h2><input id="edit-price-id" type="hidden"><label class="field">取引日<input id="edit-date" type="date" required></label><label class="field">終値<input id="edit-close" type="number" min="0.01" step="0.01" required></label><label class="field">メモ<textarea id="edit-note" maxlength="200"></textarea></label><div class="dialog-actions"><button class="secondary" value="cancel">キャンセル</button><button class="primary" value="save">保存</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=2.5"></script><script src="common.js?v=2.5"></script><script src="input.js?v=2.5"></script></body></html>
