<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a">
  <title>終値入力 | 株価成長バトル</title><link rel="stylesheet" href="style.css">
</head>
<body class="app-page input-page">
  <header class="site-header"><a class="brand" data-page="index.html">株価成長バトル</a><nav class="top-nav"><a data-page="index.html">メイン</a><a data-page="input.html" class="active">終値入力</a><a data-page="setup.html">設定</a></nav></header>
  <main class="page-shell narrow-medium">
    <div id="notice" class="message notice hidden"></div><div id="error" class="message error hidden"></div>
    <section id="missing-battle" class="panel empty-state hidden"><h1>対戦が選択されていません</h1><a class="primary button-link" href="setup.html">対戦を作成</a></section>
    <div id="input-content" class="hidden">
      <section class="page-heading"><div><p class="eyebrow">DAILY CLOSE</p><h1>終値を入力</h1><p id="battle-label" class="muted"></p></div><a data-page="index.html" class="secondary button-link compact-button">メインへ</a></section>
      <section class="panel compact-input-panel">
        <form id="price-form">
          <div class="input-meta"><label class="field">取引日<input id="trade-date" name="trade_date" type="date" required></label><label class="field">メモ（任意）<input id="price-note" name="note" maxlength="200" placeholder="決算発表など"></label></div>
          <div class="price-table-head"><span>参加者・銘柄</span><span>終値</span><span></span></div>
          <div id="price-fields" class="compact-price-list"></div>
          <button class="primary large full-button" type="submit">入力した終値を保存</button>
        </form>
      </section>
      <section class="section-block"><div class="section-heading"><div><p class="eyebrow">HISTORY</p><h2>登録履歴</h2></div><button id="export-button" class="secondary compact-button">JSON保存</button></div><div class="panel table-wrap"><table><thead><tr><th>日付</th><th>参加者</th><th>終値</th><th></th></tr></thead><tbody id="history-body"></tbody></table><div id="empty-history" class="empty-state"><p>まだ終値はありません。</p></div></div></section>
    </div>
  </main>

  <dialog id="sell-dialog"><form id="sell-form" method="dialog"><h2>売り確定</h2><p id="sell-player-label" class="dialog-description"></p><input id="sell-player-id" type="hidden"><label class="field">売却日<input id="sell-date" type="date" required></label><label class="field">売却価格<input id="sell-price" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><p class="warning-text">確定後は、この参加者の終値を入力できなくなります。</p><div class="dialog-actions"><button class="secondary" value="cancel">キャンセル</button><button class="primary" value="save">売却を確定</button></div></form></dialog>
  <dialog id="edit-dialog"><form id="edit-form" method="dialog"><h2>終値を修正</h2><input id="edit-price-id" type="hidden"><label class="field">取引日<input id="edit-date" type="date" required></label><label class="field">終値<input id="edit-close" type="number" min="0.01" step="0.01" required></label><label class="field">メモ<textarea id="edit-note" maxlength="200"></textarea></label><div class="dialog-actions"><button class="secondary" value="cancel">キャンセル</button><button class="primary" value="save">保存</button></div></form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="input.js"></script>
</body></html>
