<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>資産ダッシュボード | 株価成長バトル</title><link rel="stylesheet" href="style.css"></head>
<body class="dashboard-page compact-dashboard"><header class="site-header"><a class="brand" href="setup.html"><span class="brand-mark">↗</span><span>株価成長バトル</span></a><nav class="top-nav"><a data-page="index.html" class="active">メイン</a><a data-page="input.html">終値入力</a><a data-page="setup.html">設定</a></nav></header>
<main class="page-shell dashboard-shell"><div id="notice" class="message notice hidden"></div><div id="error" class="message error hidden"></div>
<section id="missing-battle" class="panel empty-state hidden"><h1>対戦が選択されていません</h1><p>新しい対戦を作成するか、保存済みの対戦を開いてください。</p><a class="primary button-link" href="setup.html">対戦一覧・作成</a></section>
<div id="dashboard" class="hidden dashboard-one-screen">
<section class="dashboard-topbar"><div><p class="eyebrow">PORTFOLIO DASHBOARD</p><h1 id="battle-title">資産ダッシュボード</h1><p id="battle-period" class="hero-sub"></p></div><div class="hero-actions"><button id="copy-link" class="secondary">共有URL</button><a data-page="input.html" class="primary button-link">終値入力</a></div></section>
<section class="mini-summary-row"><article><span>現在資産合計</span><strong id="total-assets">—</strong></article><article><span>合計損益</span><strong id="total-profit">—</strong></article><article><span>合計成長率</span><strong id="total-growth">—</strong></article><article><span>最新日</span><strong id="latest-date">未登録</strong></article></section>
<section class="panel compact-ranking-panel"><div class="section-heading compact"><div><p class="eyebrow">ALL MEMBERS</p><h2>4人の状況</h2></div><span id="price-days" class="pill">0日</span></div><div class="compact-ranking-head"><span>順位・名前</span><span>取得単価</span><span>現在値</span><span>成長率</span><span>現在資産</span></div><div id="ranking-cards" class="compact-ranking-list"></div></section>
<section class="panel chart-panel single-screen-chart"><div class="section-heading compact"><div><p class="eyebrow">GROWTH TREND</p><h2>成長率の推移</h2></div><span class="pill">縦軸：成長率 / 横軸：日付</span></div><div id="empty-chart" class="empty-state"><p>終値を入力するとグラフが表示されます。</p></div><div class="chart-wrap dashboard-chart"><canvas id="growth-chart"></canvas></div></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script><script src="config.js"></script><script src="common.js"></script><script src="main.js"></script></body></html>
