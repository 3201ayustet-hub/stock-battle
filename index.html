<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>株価成長バトル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-page dashboard-page">
  <header class="site-header">
    <a class="brand" data-page="index.html">株価成長バトル</a>
    <nav class="top-nav">
      <a data-page="index.html" class="active">メイン</a>
      <a data-page="input.html">終値入力</a>
      <a data-page="setup.html">設定</a>
    </nav>
  </header>

  <main class="page-shell dashboard-shell">
    <div id="notice" class="message notice hidden"></div>
    <div id="error" class="message error hidden"></div>

    <section id="missing-battle" class="panel empty-state hidden">
      <h1>対戦が選択されていません</h1>
      <p>設定ページから対戦を作成してください。</p>
      <a class="primary button-link" href="setup.html">対戦を作成</a>
    </section>

    <div id="dashboard" class="hidden">
      <section class="dashboard-titlebar">
        <div>
          <p class="eyebrow">PORTFOLIO BATTLE</p>
          <h1 id="battle-title">株価成長バトル</h1>
        </div>
        <a data-page="input.html" class="primary button-link compact-button">終値入力</a>
      </section>

      <section class="summary-grid">
        <article class="metric-card featured"><span>現在資産合計</span><strong id="total-assets">—</strong><small>繰越余剰金を含む</small></article>
        <article class="metric-card"><span>合計損益</span><strong id="total-profit">—</strong></article>
        <article class="metric-card"><span>合計成長率</span><strong id="total-growth">—</strong></article>
        <article class="metric-card"><span>最新更新</span><strong id="latest-date">未登録</strong></article>
      </section>

      <section class="panel ranking-panel">
        <div class="section-heading compact">
          <div><p class="eyebrow">ALL MEMBERS</p><h2>4人の状況</h2></div>
          <span id="price-days" class="pill">0日</span>
        </div>
        <div class="ranking-head"><span>順位・名前</span><span>取得単価</span><span>現在値</span><span>成長率</span></div>
        <div id="ranking-cards" class="ranking-list"></div>
      </section>

      <section class="panel chart-panel">
        <div class="section-heading compact">
          <div><p class="eyebrow">GROWTH TREND</p><h2>成長率の推移</h2></div>
          <span class="pill">%</span>
        </div>
        <div id="empty-chart" class="empty-state"><p>終値を入力するとグラフが表示されます。</p></div>
        <div class="chart-wrap hidden"><canvas id="growth-chart"></canvas></div>
      </section>

      <section id="rules-panel" class="panel rules-panel hidden">
        <div class="section-heading compact"><div><p class="eyebrow">RULES</p><h2>大会ルール</h2></div></div>
        <div id="rules-text" class="rules-text"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="config.js"></script><script src="common.js"></script><script src="main.js"></script>
</body>
</html>
