<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <title>株価成長バトル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" data-page="index.html">株価成長バトル</a>
  <nav class="top-nav">
    <a data-page="index.html" class="active">メイン</a>
    <button id="open-price-sheet" type="button">終値入力</button>
    <a data-page="setup.html">設定</a>
  </nav>
</header>
<main class="page-shell">
  <div id="notice" class="message notice hidden"></div>
  <div id="error" class="message error hidden"></div>
  <section id="missing-battle" class="panel empty-state hidden">
    <h1>対戦を作成してください</h1>
    <p>保存済みの対戦がないため、設定画面から作成します。</p>
    <a class="primary button-link" href="setup.html">設定を開く</a>
  </section>
  <div id="dashboard" class="hidden">
    <section class="dashboard-titlebar">
      <div><p class="eyebrow">PORTFOLIO BATTLE</p><h1 id="battle-title">株価成長バトル</h1></div>
      <button id="title-price-button" class="primary compact-button" type="button">終値入力</button>
    </section>
    <section class="summary-grid">
      <article class="metric-card featured"><span>現在資産合計</span><strong id="total-assets">—</strong></article>
      <article class="metric-card"><span>今期損益</span><strong id="period-profit">—</strong></article>
      <article class="metric-card"><span>通算損益</span><strong id="total-profit">—</strong></article>
      <article class="metric-card"><span>最新更新</span><strong id="latest-date">未登録</strong></article>
    </section>
    <section class="panel ranking-panel">
      <div class="section-heading compact"><div><p class="eyebrow">RANKING</p><h2>ランキング</h2></div></div>
      <div id="ranking-cards" class="ranking-list"></div>
    </section>
    <section class="panel chart-panel">
      <div class="section-heading compact"><div><p class="eyebrow">GROWTH TREND</p><h2>成長率の推移</h2></div><span class="pill">%</span></div>
      <div id="empty-chart" class="empty-state"><p>終値を入力するとグラフが表示されます。</p></div>
      <div class="chart-wrap hidden"><canvas id="growth-chart"></canvas></div>
    </section>
    <section id="rules-panel" class="panel rules-panel hidden">
      <div class="section-heading compact"><div><p class="eyebrow">RULES</p><h2>大会ルール</h2></div></div>
      <div id="rules-text" class="rules-text"></div>
    </section>
  </div>
</main>
<dialog id="price-sheet" class="bottom-sheet">
  <form id="price-form" method="dialog">
    <div class="sheet-handle"></div>
    <div class="sheet-heading"><div><p class="eyebrow">DAILY CLOSE</p><h2>終値を入力</h2></div><button class="icon-button" value="cancel" aria-label="閉じる">×</button></div>
    <div class="input-meta"><label class="field">取引日<input id="trade-date" name="trade_date" type="date" required></label><label class="field">メモ（任意）<input id="price-note" maxlength="200" placeholder="決算発表など"></label></div>
    <div id="price-fields" class="compact-price-list"></div>
    <button class="primary large full-button" value="save">終値を保存</button>
    <a data-page="input.html" class="secondary button-link full-button">履歴を確認・修正</a>
  </form>
</dialog>
<dialog id="sell-dialog">
  <form id="sell-form" method="dialog"><h2>利確する</h2><p id="sell-player-label" class="muted"></p><input id="sell-player-id" type="hidden"><label class="field">売却日<input id="sell-date" type="date" required></label><label class="field">売却価格<input id="sell-price" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><p class="warning-text">利確後は終値入力が停止します。あとから取り消せます。</p><div class="dialog-actions"><button class="secondary" value="cancel">キャンセル</button><button class="primary" value="save">利確を確定</button></div></form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="config.js"></script><script src="common.js"></script><script src="main.js"></script>
</body></html>
